name: Publish v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-trigger-v1.0.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Yamoon-jjang/comfyui-Ultra-Qwen-Image-Editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble release ZIP
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          prefix = "comfyui-Ultra-Qwen-Image-Editor/"
          files = [
              ".comfyignore", ".gitignore", "LICENSE", "MANUAL_EN.md",
              "README.md", "__init__.py", "pyproject.toml",
              "requirements.txt", "ultra_image_editor.py", "메뉴얼.txt",
              "web/ultra_image_editor.js",
              "assets/ultra-qwen-image-editor-node.webp",
          ]
          with ZipFile("comfyui-Ultra-Qwen-Image-Editor_v1.0.0.zip", "w", ZIP_DEFLATED) as archive:
              for name in files:
                  if not Path(name).is_file():
                      raise FileNotFoundError(name)
                  archive.write(name, prefix + name)
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_file="comfyui-Ultra-Qwen-Image-Editor_v1.0.0.zip"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$zip_file" --clobber
            gh release edit v1.0.0 --title "Ultra Qwen Image Editor + PiD v1.0.0" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v1.0.0 "$zip_file" --target "$GITHUB_SHA" --title "Ultra Qwen Image Editor + PiD v1.0.0" --notes-file RELEASE_NOTES.md --latest
          fi
